<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081527" />
    <title>You're offline — Credit Clarity</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #081527;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: rgba(46, 230, 168, 0.12);
        color: #2ee6a8;
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 20px;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #b9c8da;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 11px;
        background: #0e9f77;
        color: #ffffff;
        font-size: 14.5px;
        font-weight: 600;
        padding: 12px 22px;
        cursor: pointer;
      }
      button:hover {
        background: #0b8663;
      }
      button:focus-visible {
        outline: 2px solid #2ee6a8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">⚡</div>
      <h1>You're offline</h1>
      <p>Credit Clarity needs a connection to load your report data. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
