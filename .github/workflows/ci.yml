name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# These are placeholder values so `next build` (which reads
# NEXT_PUBLIC_* env vars at build time) succeeds in CI without talking to a
# real project. For an actual deploy workflow, replace this `env:` block with
# GitHub repository/environment secrets (Settings > Secrets and variables >
# Actions) — never commit real Supabase/Stripe/Anthropic keys here.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  ANTHROPIC_API_KEY: placeholder-anthropic-key
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
